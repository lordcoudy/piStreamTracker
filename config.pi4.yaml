# Current Raspberry Pi 4 + IMX219 160-degree camera + positional SG90 settings.
# Live-tuned on the supplied Pi; mechanical limits and pulse calibration are retained.
# camera.py owns CSI; web.py reads local MJPEG. No network changes are required.
network:
  camera_ip: "127.0.0.1"
  tracker_ip: "0.0.0.0"

camera:
  host: "127.0.0.1"
  port: 8000
  resolution: {width: 1280, height: 720}
  framerate: 25
  # White-card calibration under the tested room lighting; use auto after changing light.
  awb_mode: manual
  colour_gains: [1.0606, 1.87502]  # red, blue; calibrated with the colour-shading profile
  exposure_mode: auto  # keeps brightness in dim light, with 50 Hz flicker correction
  exposure_time_us: 30000  # starting value when switching to manual exposure
  analogue_gain: 10.66
  brightness: 0.0
  contrast: 1.0
  saturation: 1.0
  sharpness: 1.0
  noise_reduction: fast
  exposure_value: 0.0  # EV compensation only while exposure_mode is auto
  jpeg_quality: 80
  tuning_file: "tuning/imx219-160-colour.json"
  recording_dir: "camera-recordings"

tracker:
  stream_url: "http://127.0.0.1:8000/stream"
  output_dir: "recordings"  # screenshots and fallback local recordings only
  recording_mode: "camera"
  recording_fps: 25
  detection: {interval: 8, scale: 0.5}
  movenet: {threads: 1}

motors:
  backend: "gpio_servo"

gpio_servo:
  calibrated: true  # approval preserved from the supplied Pi; recalibrate a different mechanism
  frame_timeout: 0.75  # seconds; worker cancels auto movement if frames stop
  update_interval: 0.02
  max_dt: 0.1  # maximum credited time after a delayed control cycle
  home_hold: 3.0
  manual_hold: 1.0
  deadzone: 0.08  # fraction of half the image dimension, per axis
  gain: 6.0
  min_step: 0.2  # degrees; suppress small command changes
  pan:
    gpio: 18  # BCM18, physical pin 12
    calibration: {min_angle: -90, max_angle: 90, min_pulse_us: 1000, max_pulse_us: 2000}
    min_angle: -90
    max_angle: 90
    home: 0
    invert: true  # direction verified against image motion on the supplied mechanism
    max_speed: 25  # degrees/second
  tilt:
    gpio: 19  # BCM19, physical pin 35
    calibration: {min_angle: -90, max_angle: 90, min_pulse_us: 1000, max_pulse_us: 2000}
    min_angle: -45
    max_angle: 45
    home: 0
    invert: true  # direction verified against image motion on the supplied mechanism
    max_speed: 15  # degrees/second

web:
  host: "0.0.0.0"
  port: 5000
  # One automatic tracking/motor start; manual Start/Stop cancels the pending start.
  autostart_delay: 120  # delay in seconds (0-86400); null disables
  preview_max_edge: 640
  preview_max_fps: 10
  preview_quality: 65

logging:
  level: "INFO"
  file: "tracker.log"
