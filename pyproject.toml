[project]
name = "piStreamTracker"
version = "0.1.0"
description = "Human tracking system for Raspberry Pi with MoveNet pose detection and EV3 motor control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "opencv-contrib-python>=4.8.0,<4.10.0",
    "numpy>=1.20.0,<2.0.0",
    "ev3-dc>=0.9.6",
    "flask>=2.0.0",
    "tflite-runtime; platform_machine == 'aarch64' or platform_machine == 'armv7l'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pistream-install = "pistream.install:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pistream*"]

[tool.setuptools.package-data]
pistream = ["templates/*", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".kilo", ".worktrees"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

